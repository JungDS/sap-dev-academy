<!DOCTYPE html>
<!-- CH03-L03-S01 — 엔진: param-screen-lab(신규) + _autoheight · _engine/_base.css. PARAMETERS 보상 실험.
     pa_stat 타입 DE↔표준 타입 토글→F4 온·오프 · 라벨은 Selection Texts의 'Dictionary 참조' 체크로 이어받음(본문 4단계와 정합) ·
     VALUE CHECK로만 고정값 검증(F4≠검증, abapparameters_value Addition 5) · OBLIGATORY/DEFAULT/LOWER CASE · 실행(F8) mock. config=window.PSL_CFG.
     접두어 = pa_(SAP 표준 교재 관례 — 사용자 확정 2026-07-03).
     게이팅: PARAMETERS·OBLIGATORY·DEFAULT·LOWER CASE·고정값 F4만(CH03까지) — Search Help(CH09)·이벤트(CH15) 미언급. -->
<html lang="ko" data-eng="param-screen-lab">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>PARAMETERS 보상 실험 · CH03-L03-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/param-screen-lab.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">PARAMETERS 보상 실험 <small>(같은 칸, 두 타입)</small></p>
  <p class="lead"><code>pa_stat</code>의 타입을 <b>Data Element ↔ 표준 타입 직접 지정</b>으로 갈아 끼워 보세요. F4와 입력검증이 붙었다 떨어집니다. F4 목록은 자동으로 만들어지지 않습니다. <b>Domain 고정값(O/C)에서 오는 것</b>임을 눈으로 확인하세요. <b>라벨은 한 걸음 더</b> 필요합니다. Selection Texts의 <b>Dictionary 참조</b>를 체크해야 Field Label("예매 상태")을 이어받고, 꺼져 있으면 기술명 <code>PA_STAT</code>이 그대로 보입니다.</p>
  <div data-psl></div>
</div>
<script>
window.PSL_CFG = {
  de: {
    param:'pa_stat', name:'zde_status', rawType:'c LENGTH 1', label:'예매 상태',
    fixed:[ { val:'O', txt:'Open — 예매 가능' }, { val:'C', txt:'Closed — 마감' } ]
  },
  nameField: { param:'pa_name', label:'예매자 ID', sample:'jeonghy', len:20 },
  note: '표준 타입(<code>c LENGTH 1</code>)을 직접 지정하면 F4가 사라지고 라벨도 이어받을 곳이 없어집니다. <b>앞서 Domain·Data Element에 들인 수고가 화면 입력칸 하나로 돌아오는 순간</b>입니다. 라벨이 오는 길은 둘입니다. Data Element를 참조한 칸은 <b>Dictionary 참조 체크 한 번</b>으로 Field Label을 이어받고, 아래 이름 칸처럼 표준 타입 칸은 Selection Text에 <b>손으로 적어</b> 둡니다(그래서 "직접 입력"). 그리고 <b>F4는 도움말일 뿐, 값을 막는 건 <code>VALUE CHECK</code></b>입니다. 목록 밖 값 <code>X</code>를 넣고 스위치를 껐다 켜 보세요. <code>DEFAULT</code>로 채워진 값을 <b>지운 채 실행</b>하면 <code>OBLIGATORY</code>가 어떻게 막는지도 확인해 보세요. 이름 칸에서는 <code>LOWER CASE</code>를 실험해 보세요(기본은 자동 대문자 변환).'
};
</script>
<script src="../_engine/param-screen-lab.js" defer></script>
<script src="../_engine/_autoheight.js" defer></script>
</body>
</html>
