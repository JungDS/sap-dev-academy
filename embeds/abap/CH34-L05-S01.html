<!DOCTYPE html>
<!-- CH34-L05-S01 — 엔진: odata-query · _engine/_base.css. OData $filter/$top/$skip → EntitySet 결과. -->
<html lang="ko" data-eng="odata-query">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>OData 조회 · CH34-L05-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/odata-query.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">OData 조회 — 주문서를 SELECT로 번역</p>
  <p class="lead">쿼리를 바꾸면 URL과 <b>대응 SELECT 줄</b>이 함께 바뀝니다. <b>정렬 끄기</b>와 <b>filter 미반영</b>으로 두 가지 단골 사고도 겪어 보세요.</p>
  <div class="ctrl">
    <div class="fld"><label>$filter (Venue)</label><select id="venue"><option value="">(전체)</option><option>서울</option><option>부산</option><option>대구</option><option>인천</option></select></div>
    <div class="fld"><label>$top</label><input id="top" type="number" min="0" max="9" value="0" /></div>
    <div class="fld"><label>$skip</label><input id="skip" type="number" min="0" max="9" value="0" /></div>
    <label class="chk"><input type="checkbox" id="nosort" /> 정렬 끄기(사고)</label>
    <label class="chk"><input type="checkbox" id="nofilter" /> filter 미반영(사고)</label>
  </div>
  <div class="url" id="url"></div>
  <div class="selbox"><div class="h">대응 SELECT (GET_ENTITYSET 안)</div><pre id="sel"></pre></div>
  <div class="panel"><div class="oq-panel__h" id="cnt"></div><div id="body"></div></div>
  <div class="note">💡 주문서($filter·$top·$skip·$orderby)는 <b>계약</b>입니다 — WHERE(Range)·<code>UP TO</code>·<code>OFFSET</code>·<code>ORDER BY</code>로 전부 번역해야 합니다. <b>OFFSET은 ORDER BY가 전제</b>: 정렬 끄기+skip 상태에서 같은 페이지를 두 번 열어 보세요.</div>
</div>
<script src="../_engine/odata-query.js" defer></script>
</body>
</html>
