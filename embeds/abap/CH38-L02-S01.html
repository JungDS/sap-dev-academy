<!DOCTYPE html>
<!-- CH38-L02-S01 — 엔진: abap-unit-runner(cfg 확장: ur-cfg + gate) · _engine/_base.css.
     회귀 red/green + transport release gate 연동 체험. -->
<html lang="ko" data-eng="abap-unit-runner">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>회귀와 게이트 · CH38-L02-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/abap-unit-runner.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">회귀를 잡는 순간 — 그리고 게이트가 닫히는 순간</p>
  <p class="lead"><b>테스트 실행</b> 후 <b>버그 주입</b>(지난달과 같은 빈 결과 처리 실수 재발)을 켜 보세요. 어느 약속이 깨지고, release gate가 어떻게 되는지.</p>

  <div class="bar">
    <button class="run" id="run" type="button">▶ 테스트 실행</button>
    <label class="alert-toggle"><input type="checkbox" id="bug" /> 버그 주입 (예약 0건 처리를 또 깨뜨림)</label>
    <span class="summary" id="summary"></span>
  </div>

  <div class="panel">
    <div class="panel__h">ltcl_settlement — 업무 약속 3건</div>
    <div id="list"></div>
  </div>
  <div class="gate" id="gate"></div>

  <div class="note">💡 깨진 테스트의 <b>이름</b>을 읽어 보세요 — <code>regression_of_last_month</code>. 어떤 약속이 깨졌는지 이름이 말해 줍니다. 게이트에 걸려 있으면 이 상태로는 이송이 나가지 않습니다.</div>
  <script type="application/json" id="ur-cfg">
  {
    "gate": true,
    "tests": [
      { "nm": "remaining_is_total_minus_booked", "exp": 50, "ok": 50, "bug": 50 },
      { "nm": "regression_of_last_month", "exp": 100, "ok": 100, "bug": 0 },
      { "nm": "soldout_when_booked_equals_total", "exp": "X", "ok": "X", "bug": "X" }
    ]
  }
  </script>
</div>
<script src="../_engine/abap-unit-runner.js" defer></script>
</body>
</html>
