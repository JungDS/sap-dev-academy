<!DOCTYPE html>
<!-- CH38-L04-S02 — 엔진: stage-chips · _engine/_base.css. 이송 흐름 보드 — release/import/승인 신호등. -->
<html lang="ko" data-eng="stage-chips">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>이송 흐름 보드 · CH38-L04-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/stage-chips.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">이송 흐름 보드 — 상자는 어디서 멈추나</p>
  <p class="lead">상황을 누르면 <b>task → request → QAS → 승인 → PRD</b>의 신호등이 켜집니다. 멈춘 자리가 곧 고칠 자리입니다.</p>
  <div id="chips"></div>
  <div id="cases"></div>
  <div class="verdict" id="verdict"></div>
  <div class="note">💡 규칙 셋 — task 전부 release해야 request가 나가고, RC는 <b>log 본문까지</b> 읽고, QAS 승인 없이 PRD 없음. (요청 번호는 교육용 가상)</div>
  <script type="application/json" id="sc-cfg">
  {
    "chips": ["① Task release", "② Request release", "③ QAS import", "④ QAS 테스트 승인", "⑤ PRD import"],
    "scenarios": [
      { "label": "task 하나가 미release", "states": ["bad", "off", "off", "off", "off"], "warn": true,
        "verdict": "⛔ <b>①에서 정지</b> — 동료의 task가 열려 있으면 request release 버튼이 비활성입니다. 상자 속 봉투부터 밀봉." },
      { "label": "DDIC request보다 프로그램이 먼저 감", "states": ["ok", "ok", "bad", "off", "off"], "warn": true,
        "verdict": "🚨 <b>③에서 활성화 오류</b> — import는 성공처럼 보였지만 참조하는 DDIC가 아직 안 와서 RC 8. 의존 request의 순서를 바로잡고 재import." },
      { "label": "RC 4를 안 읽고 통과 처리", "states": ["ok", "ok", "warn", "warn", "off"], "warn": true,
        "verdict": "⚠ <b>경고를 삼켰다</b> — RC 4의 log 본문에 '양식 동반 오브젝트 누락' 경고가 있었습니다. QAS 테스트에서야 터지면 더 비쌉니다." },
      { "label": "QAS 승인 없이 PRD 밀어넣기", "states": ["ok", "ok", "ok", "bad", "bad"], "warn": true,
        "verdict": "⛔ <b>절차 위반</b> — 검증 안 된 상자가 운영에 먼저 들어가는 길은 없어야 정상입니다. QAS 통과·승인이 PRD의 전제." },
      { "label": "3점검 후 정상 이송", "states": ["ok", "ok", "ok", "ok", "ok"],
        "verdict": "✅ object list 완전 · 의존 순서 정리 · 게이트(ATC/Unit) 통과 — DEV에서 PRD까지 추적 가능한 길로 도착했습니다." }
    ]
  }
  </script>
</div>
<script src="../_engine/stage-chips.js" defer></script>
</body>
</html>
