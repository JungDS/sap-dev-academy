<!DOCTYPE html>
<!-- CH02-L02-S02 — 엔진: int-div-lab(신규) + _autoheight · _engine/_base.css. 정수 나눗셈 반올림 실험실.
     같은 나눗셈을 I 변수와 소수 변수에 각각 담아 결과 대조(7 / 2 → 4 vs 3.50) · 제수 0 → 실행 중 멈춤.
     게이팅: DATA·TYPE·i·나눗셈(CH02-L02까지). P LENGTH/DECIMALS는 본문과 동일하게 [선행 사용] 표시만(정식 도입 CH02-L03). -->
<html lang="ko" data-eng="int-div-lab">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정수 나눗셈 실험실 · CH02-L02-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/int-div-lab.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">정수 나눗셈 실험실 <small>(같은 나눗셈, 담는 그릇이 다르면)</small></p>
  <p class="lead">두 수를 바꿔 가며 나눠 보세요. 결과를 <code>I</code>(정수) 변수에 담을 때와 소수 변수에 담을 때가 어떻게 갈리는지 나란히 보여 줍니다. 소수 쪽 변수의 <code>TYPE p LENGTH 8 DECIMALS 2</code>는 <b>다음 레슨</b> 것이니 지금은 <b>결과 비교</b>만 보면 됩니다.</p>
  <div data-idl></div>
</div>
<script>
window.IDL_CFG = {
  a: 7, b: 2,
  intVar: { name: 'gv_r',   type: 'i' },
  decVar: { name: 'gv_amt', type: 'p LENGTH 8 DECIMALS 2', dec: 2, badge: '선행 사용' },
  presets: [
    { a: 7,  b: 2 },
    { a: 9,  b: 2 },
    { a: 10, b: 4 },
    { a: 8,  b: 2 },
    { a: 1,  b: 3 },
    { a: 7,  b: 0 }
  ],
  otherLang: '🧑‍💻 다른 언어를 해 봤다면 — Java·C#·파이썬의 정수 나눗셈은 <b>버림</b>이라 결과가 <b>{trunc}</b>, ABAP은 <b>반올림</b>이라 <b>{round}</b>. 방향이 정반대다.',
  note: '정수 박스에는 소수를 담을 자리가 없습니다. 그래서 나눗셈 결과가 안 떨어지면 <b>가장 가까운 정수로 반올림</b>돼 들어가고, 사라진 소수 부분은 <b>되돌릴 수 없습니다</b>. 개수를 세는 계산이라면 반올림이 오히려 자연스럽지만, 금액처럼 <b>1원도 틀리면 안 되는 값</b>은 정수 박스에 담으면 안 됩니다. 그 그릇은 다음 레슨에서 정식으로 배웁니다.'
};
</script>
<script src="../_engine/int-div-lab.js" defer></script>
<script src="../_engine/_autoheight.js" defer></script>
</body>
</html>
