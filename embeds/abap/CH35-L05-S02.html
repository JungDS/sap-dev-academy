<!DOCTYPE html>
<!-- CH35-L05-S02 — 엔진: pkg-tuner · _engine/_base.css. Package 크기 트레이드오프(commit↔메모리↔재처리 범위).
     총 100만 건 가정·수치는 가상 예시. 게이팅: CH35 소유(AMDP/ADBC·aRFC 구현 보류). -->
<html lang="ko" data-eng="pkg-tuner">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Package 크기 튜너 · CH35-L05-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/pkg-tuner.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">Package 크기 튜너 <small>(총 1,000,000건 가정 · 가상 수치)</small></p>
  <p class="lead">패키지 크기를 움직여 보세요. <b>commit 횟수 ↔ 피크 메모리·실패 시 재처리 범위</b>가 맞바뀝니다 — 어느 쪽도 공짜가 아닙니다.</p>
  <div class="sld"><input type="range" id="sz" min="0" max="2" step="1" value="1" /><span class="v" id="szv"></span></div>
  <div class="metric"><div class="lbl"><span>COMMIT 횟수(왕복 overhead)</span><b id="bCommitv"></b></div><div class="mtrack"><div class="mbar c1" id="bCommit"></div></div></div>
  <div class="metric"><div class="lbl"><span>피크 메모리(패키지 한 덩이)</span><b id="bMemv"></b></div><div class="mtrack"><div class="mbar c2" id="bMem"></div></div></div>
  <div class="metric"><div class="lbl"><span>실패 시 재처리 범위(마지막 패키지)</span><b id="bRedov"></b></div><div class="mtrack"><div class="mbar c3" id="bRedo"></div></div></div>
  <div class="vd" id="verdict"></div>
  <div class="note">💡 마지막 처리 key를 로그에 남기면 실패 지점부터 재시작할 수 있습니다. 정답 크기는 없고, <b>운영 최대 건수 + 실측</b>으로 정합니다.</div>
</div>
<script src="../_engine/pkg-tuner.js" defer></script>
</body>
</html>
