<!DOCTYPE html>
<!-- CH09-L07-S02 — 엔진: f4-priority-lab (embeds/_engine/f4-priority-lab.{js,css}) · 자체 postHeight.
     체험: 도움말 후보 토글 후 F4 → 가장 높은 우선순위 하나만 표시("위가 있으면 아래는 안 본다").
     (S01 정적 사다리와 병행 — 기존 학습수단 유지.) 게이팅: 직접 F4 구현은 CH15/16 예고만. 데이터=window.FPL_CFG. -->
<html lang="ko" data-eng="f4-priority-lab">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>F4 우선순위 토글 실험 · CH09-L07-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" />
<link rel="stylesheet" href="../_engine/f4-priority-lab.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">F4 우선순위 토글 실험 <small>(위가 있으면 아래는 안 본다)</small></p>
  <p class="lead">한 입력칸에 여러 도움말이 걸려 있어도 F4를 누르면 <b>가장 높은 하나만</b> 뜹니다. 후보를 켜고 끄며 <b>F4 누르기</b>를 눌러 무엇이 표시되는지 확인해 보세요.</p>

  <div class="ladder" id="ladder"></div>

  <div class="runrow">
    <button class="run-btn" id="run" type="button">🔍 F4 누르기 <kbd>F4</kbd></button>
  </div>

  <div class="popup" id="popup" style="display:none"></div>
  <div class="statusmsg none" id="statusmsg"></div>

  <div class="note"><b>맨 위 = 직접 F4(코드)</b>는 선택화면·Dynpro 이벤트에서 직접 만드는 도움말입니다 — 존재만 알고, 구현은 <a href="../../docs/abap/pages/CH15-L08.html" target="_top">Chapter 15 · Selection Screen 고급</a>과 <a href="../../docs/abap/pages/CH16-L05.html" target="_top">Chapter 16 · 화면에서 F1·F4 직접 만들기</a>에서 배웁니다. F4가 예상과 다르면 이 사다리를 위에서부터 점검하세요.</div>
</div>

<script>
/* levels = 레슨 본문 §"위에서부터 차례로" 6단과 1:1(위가 우선순위 높음).
   고정값 팝업의 N·C = 관통예제 예매 상태 정본(N=신규·C=취소, CH09-L09 시드). */
window.FPL_CFG = {
  initialOn:['sh','check'],
  levels:[
    {key:'direct', name:'코드로 직접 만든 F4', desc:'선택화면·Dynpro 이벤트에서 직접 구현 (나중에 배움)',
      popupTitle:'직접 만든 F4 (코드)', popupRows:['프로그램이 직접 채운 목록', '→ Dictionary 도움말보다 우선']},
    {key:'sh', name:'화면 칸에 직접 붙인 Search Help', desc:'MATCHCODE OBJECT로 이 칸에 콕 지정한 설계형 도움말',
      popupTitle:'Search Help · ZSH_CONCERT_COLL', popupRows:['C001  안유진  KSPO DOME', 'C002  ABAP Trio  올림픽홀', 'C003  UI5 Night  블루스퀘어']},
    {key:'fieldsh', name:'테이블·Structure의 필드에 붙인 Search Help', desc:'화면 칸이 그 필드를 쓰고 있으면 따라 올라옴 — Check Table보다 위',
      popupTitle:'Search Help · ZSH_CONCERT (필드 부착)', popupRows:['C001  안유진  KSPO DOME', 'C002  ABAP Trio  올림픽홀']},
    {key:'check', name:'Check Table · Text Table', desc:'Foreign Key 마스터 목록(+Text Table 이름)에서 자동',
      popupTitle:'Check Table · ZCONCERT', popupRows:['C001  안유진 단독 콘서트', 'C002  ABAP Trio 라이브', 'C003  UI5 Night 페스티벌']},
    {key:'fixed', name:'Domain 고정값 (Fixed Values)', desc:'Domain에 정해 둔 값. Check Table보다 아래',
      popupTitle:'Domain 고정값 · 예매 상태', popupRows:['N  신규', 'C  취소']},
    {key:'type', name:'타입 기본 도움', desc:'날짜 달력, 시간 시계 등 타입이 제공하는 기본 도움',
      popupTitle:'타입 기본 도움', popupRows:['📅 달력 / 🕒 시계 등 타입 기본 위젯']}
  ]
};
</script>
<script src="../_engine/f4-priority-lab.js" defer></script>
</body>
</html>
