<!DOCTYPE html>
<!-- CH06-L03-S01 — 엔진: key-variant-lab (embeds/_engine/key-variant-lab.{js,css}) + _autoheight.js
     config=window.KVL_CFG. 같은 데이터(정훈영30·홍길동25·정훈영35)를 ①키 생략(standard key)
     ②WITH NON-UNIQUE KEY name ③WITH UNIQUE KEY name 으로 바꿔 넣으며 중복 허용/차단·키 구성 관찰.
     ③의 종류 자리는 "…"로 비움(UNIQUE 허용 종류는 L04 매트릭스 몫 — 사실 왜곡 방지).
     게이팅: CH06-L03 범위(WITH KEY 선언·standard key·UNIQUE/NON-UNIQUE). INSERT/sy-subrc 없음(L05 전). -->
<html lang="ko" data-eng="key-variant-lab">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>키 바꿔 넣어 보기 · CH06-L03-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" />
<link rel="stylesheet" href="../_engine/key-variant-lab.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">키를 바꿔 가며 같은 데이터 넣어 보기 <small>(동명이인 정훈영 포함 3명)</small></p>
  <p class="lead">넣을 사람은 셋 — <b>정훈영/30 · 홍길동/25 · 정훈영/35</b>(동명이인!). 키 선언 ①②③을 바꿔 가며 <b>⏭ 다음 사람 넣기</b>를 눌러 보세요. 무엇이 키가 되는지(주황 칸), 같은 이름의 두 번째 정훈영이 <b>들어가는지 막히는지</b>가 달라집니다.</p>
  <div data-kvl></div>
  <div class="note">💡 ①과 ②는 결과가 같습니다 — 차이는 <b>키가 우연히 정해졌나, 내가 정했나</b>입니다. ③의 종류 자리(<code>…</code>)는 비워 뒀습니다: UNIQUE를 실제로 받아 주는 <b>종류</b>가 따로 있는데, 그 표는 다음 레슨에서 정리합니다.</div>
</div>
<script>
window.KVL_CFG = {
  cols: ['name', 'age'],
  num: [false, true],
  people: [['정훈영', 30], ['홍길동', 25], ['정훈영', 35]],
  idle: '⏭ 버튼으로 한 명씩 넣어 보세요 — 세 번째 사람(두 번째 정훈영)에서 차이가 납니다.',
  variants: [
    {
      id: 'v1', tab: '① 키 생략',
      decl: ['DATA gt_person TYPE TABLE OF ts_person.'],
      keyChip: 'standard key — 문자 계열 필드 전부 = name (자동, 숫자 age는 제외)',
      keyCols: ['name'],
      rows: [
        { ok: true, msg: '정훈영/30 입장 — 첫 행이라 무엇과도 안 겹칩니다.' },
        { ok: true, msg: '홍길동/25 입장 — 키(name)가 다르니 당연히 통과.' },
        { ok: true, dup: true, msg: '⚠ 두 번째 정훈영/35도 <b>그대로 입장</b> — 자동으로 잡힌 standard key는 중복을 막지 않습니다. 이제 "정훈영을 찾아라" 하면 어느 행일까요?' }
      ],
      done: '<b>내가 고른 기준이 아니라 타입 모양에서 우연히 만들어진 키</b>입니다. age는 숫자라 키에서 빠졌고, 동명이인은 키만으로 구분되지 않습니다 — 이것이 "느슨하다"의 정확한 뜻.'
    },
    {
      id: 'v2', tab: '② NON-UNIQUE KEY',
      decl: ['DATA gt_person TYPE TABLE OF ts_person', '               WITH NON-UNIQUE KEY name.'],
      keyChip: '내가 직접 정한 키 = name (중복 허용을 명시)',
      keyCols: ['name'],
      rows: [
        { ok: true, msg: '정훈영/30 입장.' },
        { ok: true, msg: '홍길동/25 입장.' },
        { ok: true, dup: true, msg: '두 번째 정훈영/35 입장 — <b>NON-UNIQUE</b>는 "같은 키 값이 여러 개 와도 된다"는 뜻이니까요. 결과는 ①과 같습니다.' }
      ],
      done: '결과는 ①과 같지만 결정적 차이가 있습니다 — <b>"이름으로 찾고, 중복은 허용한다"를 코드에 직접 적었다</b>는 것. 나중에 필드를 추가해도 키가 소리 없이 바뀌지 않습니다.'
    },
    {
      id: 'v3', tab: '③ UNIQUE KEY',
      decl: ['DATA gt_person TYPE … TABLE OF ts_person', '               WITH UNIQUE KEY name.'],
      keyChip: '내가 직접 정한 키 = name (중복 금지! · 종류 자리 …는 다음 레슨)',
      keyCols: ['name'],
      rows: [
        { ok: true, msg: '정훈영/30 입장 — 아직 겹치는 키가 없습니다.' },
        { ok: true, msg: '홍길동/25 입장.' },
        { ok: false, msg: '🚫 두 번째 정훈영/35 <b>거부!</b> — 키 name = 정훈영인 행이 이미 있습니다. <b>UNIQUE</b>는 같은 키 값이 두 번 들어오는 것 자체를 막습니다.' }
      ],
      done: '사번처럼 <b>절대 겹치면 안 되는 기준</b>이면 UNIQUE입니다. 단, 이 막아 줌은 <b>프로그램 메모리 안</b> 이야기 — DB에 저장할 때의 중복 방지는 별개 문제입니다.'
    }
  ]
};
</script>
<script src="../_engine/key-variant-lab.js" defer></script>
<script src="../_engine/_autoheight.js" defer></script>
</body>
</html>
