<!DOCTYPE html>
<!-- CH34-L03-S01 — 엔진: idoc-status · _engine/_base.css. IDoc 상태코드 생애주기 + 오류·BD87 재처리. -->
<html lang="ko" data-eng="idoc-status">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>IDoc 상태·재처리 · CH34-L03-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/idoc-status.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">IDoc 상태 생애주기 — 원인 수정 없인 같은 실패</p>
  <p class="lead"><b>오류 주입</b>을 켜고 수신 처리한 뒤, <b>원인 수정 없이 재처리</b>를 눌러 보세요 — 51이 반복됩니다. <b>원인 수정</b> 후에만 53에 도달합니다.</p>
  <div class="bar">
    <button class="btn" id="send" type="button">▶ 전송(Outbound)</button>
    <button class="btn" id="recv" type="button">▶ 수신 처리(Inbound)</button>
    <label class="alert-toggle"><input type="checkbox" id="err" /> 오류 주입</label>
    <button class="btn" id="fix" type="button" disabled>🔧 원인 수정</button>
    <button class="btn re" id="re" type="button" disabled>↻ BD87 재처리</button>
    <button class="reset" id="reset" type="button">↺ 초기화</button>
  </div>
  <div class="track" id="track"></div>
  <div class="panel" style="border:1px solid var(--line);border-radius:10px;margin-top:8px;overflow:hidden"><div style="background:var(--surface);padding:4px 10px;font-size:.76rem;font-weight:700;border-bottom:1px solid var(--line)">운영 이력</div><div id="slog" style="max-height:120px;overflow-y:auto;font-size:.8rem;line-height:1.6;padding:5px 10px"><div class="ph">이력이 여기 쌓입니다.</div></div></div>
  <div class="note">💡 <b>51은 원인이 아니라 결과</b> — 상태 메시지의 원인 key와 내용물 Segment를 함께 읽고, 데이터/설정을 고친 뒤 재처리합니다. 재처리는 처리 기회를 다시 주는 기능이지 오류를 고치는 기능이 아닙니다.</div>
</div>
<script src="../_engine/idoc-status.js" defer></script>
</body>
</html>
