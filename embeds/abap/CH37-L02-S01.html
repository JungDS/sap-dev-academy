<!DOCTYPE html>
<!-- CH37-L02-S01 — 엔진: compare-matrix(재사용) · _engine/_base.css. 인쇄 경로 vs PDF 경로(옵션으로 갈리는 목적지). -->
<html lang="ko" data-eng="compare-matrix">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/compare-matrix.css" />

<body>
<div class="wrap">
  <p class="hd">인쇄 경로 vs PDF 경로</p>
  <p class="lead">같은 양식, 같은 생성 함수입니다. 행을 클릭해 <b>옵션 두 줄</b>이 무엇을 갈랐는지 확인하세요.</p>
  <p class="hint">💡 행(경로 이름)을 클릭</p>
  <table><thead id="thead"></thead><tbody id="tbody"></tbody></table>
  <div class="detail idle" id="detail">경로 이름을 클릭하면 설명이 나옵니다.</div>
  <div class="note">💡 갈림길은 도구 교체가 아니라 <b>호출 옵션</b>입니다. OTF가 프린터 언어에 묶이지 않은 원형이라, 목적지(프린터/변환기)만 바꾸면 됩니다.</div>
  <script type="application/json" id="cm-cfg">
  {
    "cols": ["결과물", "결과를 받는 곳", "호출 옵션", "어울리는 일"],
    "rows": [
      { "name": "인쇄 경로 (L01)", "cells": [{"v":"종이·미리보기","r":"mid"},{"v":"출력 장치·스풀","r":"mid"},{"v":"없음(기본값)","r":"mid"},{"v":"창구 출력·확인","r":"hi"}],
        "detail": "옵션을 안 넘기면 기본값 — 인쇄 대화상자가 뜨고 출력은 장치 쪽으로 갑니다. 사람이 화면 앞에 있을 때의 경로. <b>프로그램 손에는 아무것도 남지 않습니다.</b>" },
      { "name": "PDF 경로 (L02)", "cells": [{"v":"PDF 데이터","r":"hi"},{"v":"프로그램 변수","r":"hi"},{"v":"3종 세트(getotf·no_dialog·장치)","r":"hi"},{"v":"이메일·보관·자동화","r":"hi"}],
        "detail": "옵션 세트로 OTF를 <b>otfdata</b>로 돌려받고(개인 설정 덮어쓰기는 user_settings = space로 차단), CONVERT_OTF가 PDF로 바꿉니다. 대화상자가 없어 배치에서도 돌고, 데이터가 손에 있으니 저장·첨부로 이어집니다(파일 저장은 L04)." }
    ]
  }
