<!DOCTYPE html>
<!-- CH35-L01-S01 — 엔진: sql-trace · _engine/_base.css. ST05 SQL Trace 결과 분석(정렬·최악 강조). -->
<html lang="ko" data-eng="sql-trace">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ST05 SQL Trace · CH35-L01-S01</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/sql-trace.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">ST05 SQL Trace — 정렬·분류·재측정</p>
  <p class="lead"><b>컬럼 헤더 클릭 정렬</b>로 "비싼 SQL"(총 시간)과 "반복 SQL"(실행횟수)을 각각 찾아보세요. 그다음 <b>수정 후 재측정</b>으로 수치가 어떻게 남는지 확인!</p>
  <p class="hint">💡 헤더(실행횟수·총 ms 등)를 클릭해 정렬 · 빨간 행 = 총시간 1위</p>
  <div class="panel"><div class="panel__h" id="phead">SQL Trace — Display</div>
    <table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>
  <div class="bar" style="margin:8px 0"><button id="retest" type="button" style="border:1px solid #3b5bdb;background:#3b5bdb;color:#fff;border-radius:8px;padding:6px 12px;font-size:.85rem;cursor:pointer">▶ 수정 후 재측정 (L04 적용 가정)</button></div>
  <div class="callout" id="callout"></div>
  <div class="note">💡 <b>실행횟수가 비정상적으로 많은 동일 쿼리</b>는 LOOP 안 SELECT(L04) 신호. 좋은 튜닝 기록은 "빨라졌다"가 아니라 <b>before/after 수치</b>입니다. 운영 트레이스는 짧게·대상 한정. (수치는 가상 예시)</div>
  <script type="application/json" id="trace-cfg">
  {
    "header": "ST05 — 예매현황 리포트 트레이스 (수정 전)",
    "worstKey": "ms",
    "cols": [
      { "k": "stmt", "label": "SQL 문" },
      { "k": "exec", "label": "실행횟수", "num": true },
      { "k": "ms", "label": "총 시간(ms)", "num": true },
      { "k": "rows", "label": "레코드", "num": true }
    ],
    "rows": [
      { "stmt": "SELECT artist FROM zconcert WHERE concert_id = ?", "exec": 1000, "ms": 870, "rows": 1000 },
      { "stmt": "SELECT * FROM zbooking INTO TABLE", "exec": 1, "ms": 120, "rows": 1000 },
      { "stmt": "SELECT * FROM scarr", "exec": 1, "ms": 6, "rows": 18 }
    ],
    "callout": "⚠ 실행횟수 정렬 시 1위: 같은 쿼리 <b>1,000회</b> — 전형적인 <b>LOOP 안 SELECT</b>(L04). 총 시간 정렬과 실행횟수 정렬을 모두 해 봐야 반쪽 진단을 피합니다.",
    "after": [
      { "stmt": "SELECT concert_id, artist FROM zconcert FAE", "exec": 2, "ms": 11, "rows": 240 },
      { "stmt": "SELECT * FROM zbooking INTO TABLE", "exec": 1, "ms": 120, "rows": 1000 },
      { "stmt": "SELECT * FROM scarr", "exec": 1, "ms": 6, "rows": 18 }
    ],
    "afterCallout": "✓ <b>재측정 기록</b>: 동일 SELECT 1,000회 → <b>2회</b>, 870ms → <b>11ms</b> (같은 조건). 이 한 줄이 튜닝의 완료 조건입니다 — 수치 없는 '빨라졌다'는 보고가 아닙니다."
  }
  </script>
</div>
<script src="../_engine/sql-trace.js" defer></script>
</body>
</html>
