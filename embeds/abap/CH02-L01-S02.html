<!DOCTYPE html>
<!-- CH02-L01-S02 — 엔진: var-box + _autoheight · _engine/_base.css. 변수=타입 박스+값 쪽지(#C02-1).
     선언 직후(기본값·VALUE) ↔ 값 넣기 ↔ 재대입. LIKE 짝 변수(gv_total)·체인 선언까지 커버.
     게이팅: DATA·TYPE·VALUE·LIKE·콜론 체인만(string·i) — 미도입 P/LENGTH/DECIMALS 없음. -->
<html lang="ko" data-eng="var-box">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>변수 박스 · CH02-L01-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/var-box.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">변수 = 이름표 붙은 박스, 값 = 그 안에 담는 쪽지</p>
  <p class="lead"><code>DATA</code>로 선언하면 <b>타입(라벨)</b>이 붙은 박스가 생깁니다. 아래 네 박스는 콜론(<code>:</code>) 체인으로 <b>한 번에</b> 선언한 것들입니다. <code>VALUE 10</code>을 붙인 <code>gv_qty</code>는 선언 직후부터 10으로 시작하고, <code>LIKE</code>로 만든 <code>gv_total</code>은 <code>gv_price</code>의 라벨을 그대로 물려받습니다. 버튼으로 값을 넣어 보세요.</p>
  <div data-varbox></div>
</div>
<script>
window.VB_CFG = {
  vars: [
    { name: 'gv_name',  type: 'string', value: "'정훈영'", value2: "'손흥민'" },
    { name: 'gv_qty',   type: 'i', decl: 'TYPE i VALUE 10', init: '10', value: '25',   value2: '3' },
    { name: 'gv_price', type: 'i',                                      value: '1200', value2: '900' },
    { name: 'gv_total', type: 'i', decl: 'LIKE gv_price',               value: '2400', value2: '1800' }
  ],
  stageLabels: [
    '선언 직후 — 기본값(VALUE를 적은 변수는 그 값)',
    '값을 넣은 뒤',
    '재대입 뒤 — 이전 값은 사라졌다(변수는 마지막 값만 기억)'
  ],
  note: '박스는 한 번 만들면 <b>타입이 고정</b>됩니다. 그래서 정수 박스에 담기는 값은 언제나 정수 모양, 문자 박스는 문자 모양이에요 — <b>타입에 맞는 값</b>을 넣는 것이 안전합니다. 값을 안 넣어도 박스가 비어 있는 건 아닙니다(<b>타입 기본값</b>이 들어 있고, <code>VALUE</code>를 적었으면 그 값). <code>LIKE</code>로 만든 <code>gv_total</code>은 <code>gv_price</code>와 <b>같은 라벨</b>이라 짝이 맞습니다(한 장 가격과 두 장 합계). 그리고 같은 박스에 <b>다시 대입하면 이전 쪽지는 버려집니다</b> — 변수는 <b>마지막 값만</b> 기억해요.'
};
</script>
<script src="../_engine/var-box.js" defer></script>
<script src="../_engine/_autoheight.js" defer></script>
</body>
</html>
