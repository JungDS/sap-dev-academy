<!DOCTYPE html>
<!-- CH34-L02-S02 — 엔진: ale-config · _engine/_base.css. ALE 다섯 부품 토글→발행→멈춤 지점 진단.
     시나리오: 예매 확정 통지 IDoc. 게이팅: CH34 소유(customizing 화면 상세 보류). -->
<html lang="ko" data-eng="ale-config">
<head>
<meta charset="utf-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ALE 설정 진단판 · CH34-L02-S02</title>
<link rel="stylesheet" href="../_engine/_base.css" /><link rel="stylesheet" href="../_engine/ale-config.css" />
</head>
<body>
<div class="wrap">
  <p class="hd">ALE 설정 진단판 <small>(어디서 멈추나)</small></p>
  <p class="lead">예매 확정 통지 IDoc을 파트너에 보내려 합니다. 부품을 끄고 <b>발행</b>해 보세요 — 코드는 그대로인데 <b>멈추는 지점</b>이 달라집니다.</p>
  <div class="parts">
    <label><input type="checkbox" id="pLS" checked /> 주소록(Logical System) 정상</label>
    <label><input type="checkbox" id="pBD64" checked /> 배포 규칙표(Distribution Model) 있음</label>
    <label><input type="checkbox" id="pDist" checked /> 모델 배포(distribute) 완료</label>
    <label><input type="checkbox" id="pWE20" checked /> 파트너 계약서(Partner Profile) 있음</label>
    <label><input type="checkbox" id="pPort" checked /> 통로·접속(Port/Destination) 정상</label>
  </div>
  <div class="bar">
    <button id="publish" type="button" class="prim">▶ IDoc 발행</button>
    <button id="diag" type="button">설정 누락 진단</button>
    <button id="reset" type="button">↺ 초기화</button>
  </div>
  <div id="track"></div>
  <div class="fb" id="fb">부품을 끄고 발행해 보세요 — 멈추는 지점이 달라집니다.</div>
  <div class="note">💡 규칙표(모델)는 "보낼 관계", 계약서(Partner Profile)는 "처리 방법", 통로(Port)는 실제 경로 — 하나라도 빠지면 봉투는 그 자리에 멈춥니다. 마지막 증명은 항상 <b>실제 한 건의 Status 이력</b>.</div>
</div>
<script src="../_engine/ale-config.js" defer></script>
</body>
</html>
